<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operadores de Comparación — Simulador Interactivo</title>
  <style>
    /* =========================================================
       1. VARIABLES DE COLOR Y ESTILOS BASE
       ========================================================= */
    :root {
      --bg-page: #f4f7fb;
      --bg-card: #ffffff;
      --bg-panel: linear-gradient(180deg, #f8fbff 0%, #eef5ff 100%);
      --text-main: #0f172a;
      --text-muted: #475569;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --blue-border: #bfdbfe;
      --red: #dc2626;
      --red-soft: #f05a5b;
      --green: #16a34a;
      --border-gray: #cbd5e1;
      --shadow-soft: 0 12px 30px -10px rgba(15, 23, 42, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Roboto', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem 1rem;
    }

    .simulator-wrapper {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* =========================================================
       2. ENCABEZADO
       ========================================================= */
    .sim-header {
      text-align: center;
    }

    .sim-category {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 0.4rem;
    }

    .sim-title {
      font-size: clamp(1.75rem, 3.5vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    .sim-title .highlight {
      color: var(--blue);
    }

    .sim-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .sim-subtitle .txt-true {
      color: var(--green);
      font-weight: 700;
    }

    .sim-subtitle .txt-false {
      color: var(--red);
      font-weight: 700;
    }

    .sim-subtitle code {
      background: #e2e8f0;
      color: var(--text-main);
      padding: 0.15rem 0.45rem;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.88em;
      font-weight: 600;
    }

    /* =========================================================
       3. PANEL CENTRAL INTERACTIVO
       ========================================================= */
    .sim-panel {
      background: var(--bg-panel);
      border: 1.5px solid var(--blue-border);
      border-radius: 20px;
      padding: 2.25rem 1.5rem;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.75rem;
    }

    /* Fila superior: [Caja 1] (Operador) [Caja 2] */
    .comparison-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .value-box {
      width: 112px;
      height: 112px;
      background-color: var(--red-soft);
      border: 3px solid transparent;
      border-radius: 16px;
      color: #ffffff;
      font-size: 2.75rem;
      font-weight: 800;
      text-align: center;
      font-family: inherit;
      outline: none;
      box-shadow: 0 8px 20px -6px rgba(220, 38, 38, 0.45);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    /* Ocultar flechas nativas de input[type="number"] */
    .value-box::-webkit-inner-spin-button,
    .value-box::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .value-box {
      -moz-appearance: textfield;
    }

    .value-box:hover {
      transform: translateY(-2px);
    }

    .value-box:focus {
      background-color: var(--red);
      border-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.28);
    }

    .operator-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.45rem;
    }

    .operator-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background-color: var(--blue);
      color: #ffffff;
      font-size: 2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 20px -6px rgba(37, 99, 235, 0.55);
      transition: transform 0.18s ease;
    }

    .operator-label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* =========================================================
       4. BOTONES DE SELECCIÓN DE OPERADOR
       ========================================================= */
    .operator-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.65rem;
      width: 100%;
    }

    .op-btn {
      min-width: 96px;
      height: 48px;
      padding: 0 1rem;
      border-radius: 12px;
      border: 1.5px solid var(--border-gray);
      background-color: var(--bg-card);
      color: var(--text-main);
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .op-btn:hover:not(.active) {
      border-color: var(--blue);
      color: var(--blue);
      transform: translateY(-1px);
    }

    .op-btn.active {
      background-color: var(--blue);
      border-color: var(--blue);
      color: #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.2);
    }

    /* =========================================================
       5. ÁREA DE RESULTADO
       ========================================================= */
    .result-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.65rem;
      text-align: center;
    }

    .result-expression {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .result-expression .expr-formula {
      color: var(--blue);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9rem;
    }

    .result-badge {
      min-width: 190px;
      padding: 0.85rem 2rem;
      border-radius: 14px;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background-color 0.2s ease, transform 0.18s ease, box-shadow 0.2s ease;
    }

    .result-badge.is-true {
      background-color: var(--green);
      box-shadow: 0 10px 22px -6px rgba(22, 163, 74, 0.45);
    }

    .result-badge.is-false {
      background-color: var(--red);
      box-shadow: 0 10px 22px -6px rgba(220, 38, 38, 0.45);
    }

    /* =========================================================
       6. LEYENDA INFERIOR (6 TARJETAS)
       ========================================================= */
    .legend-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.75rem;
    }

    .legend-card {
      background-color: var(--bg-card);
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      padding: 1rem 0.75rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
      transition: border-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
    }

    .legend-card:hover {
      border-color: var(--blue);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px -6px rgba(37, 99, 235, 0.2);
    }

    .legend-card.active {
      border-color: var(--blue);
      background-color: #eff6ff;
    }

    .legend-symbol {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--blue);
    }

    .legend-desc {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-main);
    }

    /* Responsividad para tablets y móviles */
    @media (max-width: 820px) {
      .legend-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 520px) {
      .value-box {
        width: 92px;
        height: 92px;
        font-size: 2.2rem;
      }
      .operator-circle {
        width: 58px;
        height: 58px;
        font-size: 1.6rem;
      }
      .legend-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <section class="simulator-wrapper" aria-label="Simulador de operadores de comparación">
    <!-- ENCABEZADO -->
    <header class="sim-header">
      <span class="sim-category">Categoría 2</span>
      <h1 class="sim-title">
        Operadores de <span class="highlight">Comparación</span>
      </h1>
      <p class="sim-subtitle">
        Comparan dos valores y devuelven <span class="txt-true">VERDADERO</span> o
        <span class="txt-false">FALSO</span>. Son la base de <code>SI()</code>.
      </p>
    </header>

    <!-- PANEL CENTRAL -->
    <main class="sim-panel">
      <!-- Cajas de valores editables + círculo operador -->
      <div class="comparison-stage">
        <input
          id="num1"
          type="number"
          step="any"
          value="5"
          class="value-box"
          aria-label="Primer valor a comparar"
        />

        <div class="operator-indicator">
          <div id="active-operator-circle" class="operator-circle" aria-live="polite">=</div>
          <span class="operator-label">Operador</span>
        </div>

        <input
          id="num2"
          type="number"
          step="any"
          value="3"
          class="value-box"
          aria-label="Segundo valor a comparar"
        />
      </div>

      <!-- Fila de botones seleccionables -->
      <div class="operator-buttons" role="group" aria-label="Seleccionar operador de comparación">
        <button type="button" class="op-btn active" data-op="=" aria-pressed="true">=</button>
        <button type="button" class="op-btn" data-op=">" aria-pressed="false">&gt;</button>
        <button type="button" class="op-btn" data-op="<" aria-pressed="false">&lt;</button>
        <button type="button" class="op-btn" data-op=">=" aria-pressed="false">&gt;=</button>
        <button type="button" class="op-btn" data-op="<=" aria-pressed="false">&lt;=</button>
        <button type="button" class="op-btn" data-op="<>" aria-pressed="false">&lt;&gt;</button>
      </div>

      <!-- Área de resultado dinámico -->
      <div class="result-area" aria-live="polite">
        <p class="result-expression">
          RESULTADO DE <span id="expression-preview" class="expr-formula">=5=3</span>
        </p>
        <div id="result-badge" class="result-badge is-false">
          ✗ FALSO
        </div>
      </div>
    </main>

    <!-- LEYENDA INFERIOR (6 TARJETAS) -->
    <footer class="legend-grid" aria-label="Explicación de operadores">
      <div class="legend-card active" data-op="=">
        <span class="legend-symbol">=</span>
        <span class="legend-desc">Igual a (==)</span>
      </div>
      <div class="legend-card" data-op=">">
        <span class="legend-symbol">&gt;</span>
        <span class="legend-desc">Mayor que (&gt;)</span>
      </div>
      <div class="legend-card" data-op="<">
        <span class="legend-symbol">&lt;</span>
        <span class="legend-desc">Menor que (&lt;)</span>
      </div>
      <div class="legend-card" data-op=">=">
        <span class="legend-symbol">&gt;=</span>
        <span class="legend-desc">Mayor o igual (&gt;=)</span>
      </div>
      <div class="legend-card" data-op="<=">
        <span class="legend-symbol">&lt;=</span>
        <span class="legend-desc">Menor o igual (&lt;=)</span>
      </div>
      <div class="legend-card" data-op="<>">
        <span class="legend-symbol">&lt;&gt;</span>
        <span class="legend-desc">Distinto de (&lt;&gt;)</span>
      </div>
    </footer>
  </section>

  <script>
    // =========================================================
    // LÓGICA DEL SIMULADOR DE OPERADORES DE COMPARACIÓN
    // =========================================================

    const num1Input = document.getElementById('num1');
    const num2Input = document.getElementById('num2');
    const operatorCircle = document.getElementById('active-operator-circle');
    const expressionPreview = document.getElementById('expression-preview');
    const resultBadge = document.getElementById('result-badge');
    const operatorButtons = document.querySelectorAll('.op-btn');
    const legendCards = document.querySelectorAll('.legend-card');

    let currentOperator = '=';

    /**
     * Evalúa dos valores numéricos usando operadores nativos de JavaScript.
     */
    function evaluateComparison(a, op, b) {
      switch (op) {
        case '=':
          return a == b;
        case '>':
          return a > b;
        case '<':
          return a < b;
        case '>=':
          return a >= b;
        case '<=':
          return a <= b;
        case '<>':
          return a != b;
        default:
          return false;
      }
    }

    /**
     * Lee los valores actuales, recalcula la expresión y actualiza toda la UI.
     */
    function updateSimulator() {
      const raw1 = num1Input.value.trim();
      const raw2 = num2Input.value.trim();
      const val1 = raw1 === '' || raw1 === '-' ? 0 : Number(raw1);
      const val2 = raw2 === '' || raw2 === '-' ? 0 : Number(raw2);

      operatorCircle.textContent = currentOperator;
      expressionPreview.textContent = `=${val1}${currentOperator}${val2}`;

      const isTrue = evaluateComparison(val1, currentOperator, val2);

      if (isTrue) {
        resultBadge.textContent = '✓ VERDADERO';
        resultBadge.classList.remove('is-false');
        resultBadge.classList.add('is-true');
      } else {
        resultBadge.textContent = '✗ FALSO';
        resultBadge.classList.remove('is-true');
        resultBadge.classList.add('is-false');
      }
    }

    /**
     * Cambia el operador activo, sincroniza botones/tarjetas y recalcula.
     */
    function selectOperator(op) {
      currentOperator = op;

      operatorButtons.forEach((btn) => {
        const isActive = btn.dataset.op === op;
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-pressed', String(isActive));
      });

      legendCards.forEach((card) => {
        card.classList.toggle('active', card.dataset.op === op);
      });

      operatorCircle.style.transform = 'scale(1.08)';
      setTimeout(() => {
        operatorCircle.style.transform = 'scale(1)';
      }, 140);

      updateSimulator();
    }

    num1Input.addEventListener('input', updateSimulator);
    num2Input.addEventListener('input', updateSimulator);

    operatorButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        selectOperator(btn.dataset.op);
      });
    });

    legendCards.forEach((card) => {
      card.addEventListener('click', () => {
        selectOperator(card.dataset.op);
      });
    });

    updateSimulator();
  </script>
</body>
</html>
