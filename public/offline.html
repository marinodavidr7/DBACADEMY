<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090D16" />
    <title>Sin conexión · DB Academy</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overscroll-behavior: none;
        background-color: #090d16;
        color: #f8fafc;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
          calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
      }
      .card {
        width: 100%;
        max-width: 420px;
        border-radius: 16px;
        border: 1px solid #1e293b;
        background-color: #0f172a;
        padding: 28px 24px;
        text-align: center;
      }
      .logo {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        margin: 0 auto 16px;
        display: block;
        border: 1px solid #1e293b;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
        line-height: 1.3;
        font-weight: 700;
        color: #f8fafc;
      }
      p {
        margin: 0 0 22px;
        font-size: 0.9375rem;
        line-height: 1.55;
        color: #cbd5e1;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      button,
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        width: 100%;
        border-radius: 10px;
        font-size: 0.9375rem;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.12s ease, opacity 0.12s ease;
      }
      button:active,
      a:active {
        transform: scale(0.98);
      }
      .primary {
        border: 0;
        background-color: #0052cc;
        color: #ffffff;
      }
      .secondary {
        border: 1px solid #334155;
        background-color: #17233b;
        color: #e2e8f0;
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <img class="logo" src="/pwa-192x192.png" alt="DB Academy" width="64" height="64" />
      <h1>Sin conexión a internet</h1>
      <p>
        No pudimos conectar con los servidores de DB Academy en este momento. Tus lecciones y el
        laboratorio de Excel en caché seguirán disponibles en cuanto recargues o recuperes señal.
      </p>
      <div class="actions">
        <button type="button" class="primary" onclick="window.location.reload()">
          Reintentar conexión
        </button>
        <a class="secondary" href="/">Volver a DB Academy</a>
      </div>
    </main>
  </body>
</html>
